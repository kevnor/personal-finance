name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run the suite
        # The real statements are gitignored, so the tests that assert this
        # dataset's own figures skip here. Everything structural runs on the
        # synthetic statements in server/test/fixtures/statements.py.
        run: python -m pytest -q -rs

  client:
    name: client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
