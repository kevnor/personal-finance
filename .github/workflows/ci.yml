name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The project plus its dev group: the API tests need fastapi and
        # httpx, and the ingest/budget tests need neither -- installing the
        # lot keeps one command for both.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest httpx
      - name: Run the suite
        # The real statements are gitignored, so the tests that assert this
        # dataset's own figures skip here. Everything structural runs on the
        # synthetic statements in server/test/fixtures/statements.py.
        run: python -m pytest -q -rs

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
        working-directory: client
      - name: Test
        run: npm test
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
